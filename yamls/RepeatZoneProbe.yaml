info:
  name: "RepeatZoneProbe"
  thinking: |
    Repeat Zone の最低限の接続確認用サンプル。

    1. 小さな Cube を 1 個作る。
    2. Repeat Input の初期 Geometry は空のままにし、Zone 内では Iteration を使って
       Iteration * Step height の Z オフセットを計算する。
    3. その値で Cube を上方向へずらし、前回までの Geometry に Join して Repeat Output に戻す。
    4. Iterations 回だけ繰り返すことで、指定回数と同数のキューブ列を得る。
parameter:
  - name: "Repeat count"
    socket_type: "NodeSocketInt"
    description: "Number of extra cubes generated by the repeat zone"
    default_value: 4
    min_value: 0
    max_value: 32
  - name: "Step height"
    socket_type: "NodeSocketFloat"
    description: "Vertical spacing between repeated cubes"
    subtype: "DISTANCE"
    default_value: 0.18
    min_value: 0.0
    max_value: "inf"
node:
  - id: "cube"
    type: "GeometryNodeMeshCube"
    inputs:
      Size:
        value: [0.12, 0.12, 0.12]
  - id: "repeat_in"
    type: "GeometryNodeRepeatInput"
    zone_pair: "repeat_out"
    inputs:
      Iterations:
        from: "input.Repeat count"
  - id: "offset_z"
    type: "ShaderNodeMath"
    props:
      operation: "MULTIPLY"
    inputs:
      Value:
        from: "repeat_in.Iteration"
      Value_001:
        from: "input.Step height"
  - id: "translate"
    type: "ShaderNodeCombineXYZ"
    inputs:
      Z:
        from: "offset_z.Value"
  - id: "xform_cube"
    type: "GeometryNodeTransform"
    inputs:
      Geometry:
        from: "cube.Mesh"
      Translation:
        from: "translate.Vector"
  - id: "join"
    type: "GeometryNodeJoinGeometry"
    inputs:
      Geometry:
        - from: "repeat_in.Geometry"
        - from: "xform_cube.Geometry"
  - id: "repeat_out"
    type: "GeometryNodeRepeatOutput"
    inputs:
      Geometry:
        from: "join.Geometry"
output:
  Geometry:
    from: "repeat_out.Geometry"
